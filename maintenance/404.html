<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メンテナンス中</title>
<meta name="robots" content="noarchive">
<style>
  :root { --bg: #f7f6f3; --fg: #1f1f1f; --muted: #6b6b6b; --line: #dcdad4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #ecebe8; --muted: #9a9894; --line: #333; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; padding: 0 16px; }
  main { max-width: 32rem; text-align: center; }
  h1 { font-size: 1.375rem; font-weight: 600; letter-spacing: .04em; margin: 0 0 1rem; }
  p { line-height: 1.9; margin: 0; color: var(--muted); font-size: .9375rem; word-break: auto-phrase; }
  hr { width: 2.5rem; border: 0; border-top: 1px solid var(--line); margin: 2rem auto; }
  .en { font-size: .8125rem; }
</style>
</head>
<body>
<main>
  <h1>ただいまメンテナンス中です</h1>
  <p>ご不便をおかけして申し訳ございません。<br>再開まで今しばらくお待ちください。</p>
  <hr>
  <p class="en">This site is temporarily unavailable for maintenance.<br>Thank you for your patience.</p>
</main>
</body>
</html>
